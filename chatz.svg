<text x="24" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9da7b3">Real-time one-to-one chat app with registration and login.</text>
<text x="24" y="111" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9da7b3">Layered Spring Boot backend with Oracle tables mapped through</text>
<text x="24" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9da7b3">Hibernate, and instant messaging over WebSocket and STOMP.</text>
