<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Banda Karthik, AI and Data Science, Java Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.6" stop-color="#111b2e"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#58a6ff" fill-opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#dots)"/>

  <!-- graph motif (nod to GNN research) -->
  <g stroke="#58a6ff" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <line x1="860" y1="70" x2="960" y2="130"/>
    <line x1="960" y1="130" x2="1060" y2="80"/>
    <line x1="960" y1="130" x2="930" y2="230"/>
    <line x1="930" y1="230" x2="1050" y2="215"/>
    <line x1="1060" y1="80" x2="1130" y2="160"/>
    <line x1="1050" y1="215" x2="1130" y2="160"/>
    <line x1="860" y1="70" x2="930" y2="230"/>
  </g>
  <g fill="#0d1117" stroke="#79c0ff" stroke-width="2.4">
    <circle cx="860" cy="70" r="9"/>
    <circle cx="960" cy="130" r="13">
      <animate attributeName="r" values="13;16;13" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="80" r="9"/>
    <circle cx="930" cy="230" r="9"/>
    <circle cx="1050" cy="215" r="11"/>
    <circle cx="1130" cy="160" r="9"/>
  </g>

  <text x="60" y="130" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="url(#name)">Banda Karthik</text>
  <text x="62" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c9d1d9">AI and Data Science  •  Java Full-Stack  •  Research</text>
  <text x="62" y="222" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#58a6ff">Final-year B.Tech  |  LBRCE  |  Research Intern, IIT Guwahati</text>
  <rect x="62" y="240" width="90" height="4" rx="2" fill="#1f6feb"/>
</svg>
